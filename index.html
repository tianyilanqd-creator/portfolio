 q('#project').textContent=n===0?'关于怡兰':projects[n].title;
 for(const el of [q('#project'),q('#view')]){
  el.getAnimations?.().forEach(a=>a.cancel());
  if(!rm.matches)el.animate?.([{opacity:.18,translate:'0 5px'},{opacity:1,translate:'0 0'}],{duration:260,easing:'ease-out'});
 }
}
function tick(){
 current+=(target-current)*.09;leanX+=(wantX-leanX)*.08;leanY+=(wantY-leanY)*.08;
 draw();
 if(expansion===1)syncFeature(hovered??mod(Math.round(current)));
 if(Math.abs(target-current)+Math.abs(leanX-wantX)+Math.abs(leanY-wantY)<.003&&expansion===1){current=target;draw();syncFeature(hovered??mod(Math.round(current)));raf=0;return}
 raf=requestAnimationFrame(tick)
}
function animateRing(){if(!raf)raf=requestAnimationFrame(tick)}
function select(n){hovered=null;target=n;if(rm.matches){current=target;draw();syncFeature(hovered??mod(Math.round(current)))}else animateRing()}
function revealRing(){
 if(rm.matches){expansion=1;select(0);return}
 current=-len;target=0;expansion=0;world.classList.add('unfolding');
 const token=++revealId,start=performance.now();
 function reveal(now){
  if(token!==revealId||phase!=='world')return;
  const p=Math.min(1,(now-start)/2100),out=1-(1-p)**3;
  expansion=out;current=-len*(1-out);draw();
  if(p<1&&phase==='world')requestAnimationFrame(reveal);else{expansion=1;world.classList.remove('unfolding');select(0)}
 }
 requestAnimationFrame(reveal);
}
function enter(){
 if(phase!=='desk')return;phase='dive';
 const r=q('.screen').getBoundingClientRect();
 q('#camera').style.setProperty('--sx',(r.x+r.width/2)+'px');
 q('#camera').style.setProperty('--sy',(r.y+r.height/2)+'px');
 intro.classList.add('diving');intro.inert=true;select(0);
 const ms=rm.matches?0:1080;
 setTimeout(()=>{world.classList.add('ready');world.inert=false;intro.classList.add('gone');phase='world';wheelTime=performance.now()+120;revealRing();q('#view').focus({preventScroll:true})},ms);
}
function back(){revealId++;expansion=1;world.classList.remove('unfolding');phase='desk';world.inert=true;world.classList.remove('ready');intro.classList.remove('gone','diving');intro.inert=false;q('#enter').focus({preventScroll:true})}
intro.onclick=enter;intro.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)+Math.abs(e.deltaX)>5)enter()},{passive:true});
let touch=null;
intro.addEventListener('pointerdown',e=>touch=[e.clientX,e.clientY]);
intro.addEventListener('pointermove',e=>{if(touch&&Math.hypot(e.clientX-touch[0],e.clientY-touch[1])>28){touch=null;enter()}});
for(const event of ['pointerup','pointercancel','pointerleave'])intro.addEventListener(event,()=>touch=null);
q('#back').onclick=back;q('#prev').onclick=()=>select(Math.round(target)-1);q('#next').onclick=()=>select(Math.round(target)+1);
world.addEventListener('wheel',e=>{
 if(phase!=='world')return;e.preventDefault();if(expansion<1||performance.now()<wheelTime)return;const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;
 if(Math.abs(d)<1)return;select(target+Math.max(-.72,Math.min(.72,d*.0034)));
},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.button!==0||expansion<1)return;press={x:e.clientX,y:e.clientY,id:e.pointerId,n:Math.round(target),moving:false}});
window.addEventListener('pointermove',e=>{
 if(phase==='world'&&!rm.matches&&expansion===1){wantX=(e.clientY/innerHeight-.5)*2;wantY=(e.clientX/innerWidth-.5)*2;animateRing()}
 if(!press||press.id!==e.pointerId)return;
 let dx=e.clientX-press.x,dy=e.clientY-press.y;
 if(!press.moving&&Math.hypot(dx,dy)<9)return;
 press.moving=true;stage.classList.add('dragging');
 const delta=Math.abs(dx)>Math.abs(dy)?dx:dy;
 select(press.n-delta/(stage.clientWidth*.28));
});
function release(e){if(!press||press.id!==e.pointerId)return;if(press.moving){suppress=performance.now()+250;select(Math.round(target))}press=null;stage.classList.remove('dragging')}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
window.addEventListener('keydown',e=>{
 if(panel.open)return;
 if(phase==='desk'&&[' ','ArrowDown','PageDown'].includes(e.key)&&e.target.tagName!=='BUTTON'){e.preventDefault();enter()}
 if(phase!=='world')return;
 if(expansion<1&&e.key!=='Escape')return;
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();select(Math.round(target)+(e.key==='ArrowRight'?1:-1))}
 if(e.key==='Escape')back();
});
const foodStills = ["assets/19cee264ccab98c8deab.jpg", "assets/8f44f6de1f6c34ff9fbe.jpg", "assets/b60cdd165127a38542cf.jpg"];

function attachCreatorVideos(){
 const videos=Array.from(q('#body').querySelectorAll?.('.creator-videos video') || []);
 if(!videos.length)return;
 creatorVideoURLs = creatorVideoData;
 videos.forEach((video,j)=>{
  video.src=creatorVideoURLs[j];

 const copy=resumeCopy[i];select(Math.round(target)+relative(i,Math.round(target)));
 if(i===photoCase){openPhotography(copy.title);return}

 copy.groups.map(([h,rows])=>(h?'<h3>'+esc(h)+'</h3>':'')+rows.map(t=>'<p>'+esc(t)+'</p>').join('')).join('');
 const img=(src,alt,cls='case-media')=>'<figure class="'+cls+'"><img src="'+src+'" alt="'+alt+'"></figure>';

 ([1,3].includes(i)?img(extraCaseStills[i===1?'creator':'eleme'],i===1?'留学生高温天日记':'外卖骑手街头英语培训'):'')+

 (i===4?foodStills.map((src,j)=>img(src,['鸿涛苑门店','鑫复盛礼记酒店','青岛老味道门店'][j])).join(''):'')+
 (i===0?'<p>邮箱：<a href="mailto:tianyilanqd@126.com">tianyilanqd@126.com</a></p>':''));

function openPhotography(title){
 openPanel(`<section class="photo-album" aria-label="${title}">
  <div class="photo-stage">
   <img class="current" alt=""><img alt="" aria-hidden="true">
   <button type="button" data-step="-1" aria-label="上一张"></button>
   <button type="button" data-step="1" aria-label="下一张"></button>
   <span class="photo-hint" aria-hidden="true" hidden></span>
  </div>
  <footer><h2>${title}</h2><div>
   <button type="button" data-step="-1" aria-label="上一张">←</button>
   <output aria-live="polite">01 / ${fmt(photography.length)}</output>
   <button type="button" data-step="1" aria-label="下一张">→</button>
  </div></footer>
 </section>`,true);
 const album=q('.photo-album'), surface=album.querySelector('.photo-stage');
 const [first,second]=surface.querySelectorAll('img');
 const count=album.querySelector('output'), hint=album.querySelector('.photo-hint');
 let index=0, active=first, incoming=second, revision=0, start=null, wheelAt=-Infinity, wheelMotion=0, wheelDirection=0, skipClick=false;
 const total=photography.length;
 first.src=photography[0].src;
 first.alt='摄影作品 01';
 const counter=()=>fmt(index+1)+' / '+fmt(total);
 const updateHint=()=>{hint.textContent=(hint.dataset.step==='-1'?'上一张':'下一张')+'  '+counter()};
 async function step(delta){
  index=(index+delta+total)%total;
  const token=++revision, photo=photography[index];
  incoming.src=photo.src;
  try{await incoming.decode()}catch{return}
  if(token!==revision||!album.isConnected)return;
  active.classList.remove('current');
  active.setAttribute('aria-hidden','true');
  incoming.classList.add('current');
  incoming.removeAttribute('aria-hidden');
  incoming.alt='摄影作品 '+fmt(index+1);
  [active,incoming]=[incoming,active];
  count.textContent=counter();
  updateHint();
 }
 album.querySelectorAll('[data-step]').forEach(button=>{
  button.onclick=()=>{if(!skipClick)step(Number(button.dataset.step))};
 });
 panel.onkeydown=e=>{
  if(!album.isConnected||!['ArrowLeft','ArrowRight'].includes(e.key))return;
  e.preventDefault();step(e.key==='ArrowRight'?1:-1);
 };
 surface.onpointerdown=e=>{start=e.clientX;skipClick=false};
 surface.onpointerup=e=>{
  if(start===null)return;
  const offset=e.clientX-start;
  start=null;
  if(Math.abs(offset)<36)return;
  skipClick=true;step(offset<0?1:-1);
  setTimeout(()=>{skipClick=false},0);
 };
 surface.onpointercancel=()=>{start=null};
 surface.onpointermove=e=>{
  if(e.pointerType!=='mouse')return;
  hint.dataset.step=e.target.dataset.step;
  hint.hidden=false;
  hint.style.left=Math.min(e.clientX-surface.getBoundingClientRect().left,surface.clientWidth-130)+'px';
  hint.style.top=e.clientY-surface.getBoundingClientRect().top+'px';
  updateHint();
 };
 surface.onpointerleave=()=>{hint.hidden=true};
 surface.addEventListener('wheel',e=>{
  e.preventDefault();
  const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  const direction=Math.sign(delta);
  const now=performance.now();
  if(direction!==wheelDirection)wheelMotion=0;
  wheelDirection=direction;
  wheelMotion+=Math.abs(delta)*(e.deltaMode===1?16:1);
  if(wheelMotion<30||now-wheelAt<340)return;
  wheelAt=now;wheelMotion=0;step(direction);
 },{passive:false});
}

feature.onclick=()=>{if(expansion===1&&performance.now()>=suppress)detail(displayed)};

let previousSecond=-1;
const clock=q('#clock');
const dateFormat=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',weekday:'long',month:'long',day:'numeric',year:'numeric'});
const timeFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function updateClock(){
 const now=new Date();
 if(now.getSeconds()===previousSecond)return;
 previousSecond=now.getSeconds();
 clock.textContent=timeFormat.format(now)+' (CST) '+dateFormat.format(now);
}

if(typeof setInterval==='function')setInterval(updateClock,1000);
